<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="newsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#newsGrad)" />
  
  <!-- Accent Glow -->
  <circle cx="500" cy="100" r="140" fill="#d97706" opacity="0.15" filter="blur(30px)" />
  
  <!-- Category Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#d97706" />
    <text x="75" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">REKOMENDASI UNIT</text>
  </g>

  <!-- Graphic Icon Illustration -->
  <g transform="translate(250, 100)" opacity="0.3">
    <circle cx="50" cy="50" r="70" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="8 6"/>
    <path d="M25 50 L45 70 L80 30" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Article Headline Preview -->
  <g transform="translate(40, 160)">
    <text x="0" y="30" font-family="'Outfit', sans-serif" font-weight="700" font-size="24" fill="#ffffff" width="520">
      Rekomendasi Matic Second Paling Irit 2026
    </text>
    <line x1="0" y1="90" x2="520" y2="90" stroke="#334155" stroke-width="1"/>
    <text x="0" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#38bdf8">MOKAS Otomotif & Legalitas Guide • 2026</text>
  </g>
</svg>